name: automail

on:
  schedule:
    # A cada 30 min, seg-sex, das 8h as 18h30 de Brasilia (= 11h-21h UTC)
    - cron: "*/30 11-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Modo seguro (nao modifica nem responde nada)"
        required: true
        type: boolean
        default: true

concurrency:
  group: automail
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Montar token.json
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: |
          if [ -z "$GMAIL_TOKEN" ]; then
            echo "[ERRO] Secret GMAIL_TOKEN ausente."
            exit 1
          fi
          echo "$GMAIL_TOKEN" > token.json

      - name: Montar config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -z "$CONFIG_JSON" ]; then
            echo "[ERRO] Secret CONFIG_JSON ausente."
            exit 1
          fi
          echo "$CONFIG_JSON" > config.json

      - name: Executar automacao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          META_WA_ACCESS_TOKEN: ${{ secrets.META_WA_ACCESS_TOKEN }}
          META_WA_PHONE_NUMBER_ID: ${{ secrets.META_WA_PHONE_NUMBER_ID }}
          INFOBIP_API_KEY: ${{ secrets.INFOBIP_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi
